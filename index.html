<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絵文字ジェネレーター（ローカル生成）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=M+PLUS+1p:wght@900&family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
<style>
  :root { --accent: #E0457F; --border: #ddd; }
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; color: #333; }
  .header { background: #f6f6f7; color: #333; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .header h1, .layout { max-width: 960px; margin-left: auto; margin-right: auto; padding-left: 16px; padding-right: 16px; }
  .header h1 { font-size: 18px; margin-top: 0; margin-bottom: 0; padding-top: 14px; padding-bottom: 14px; }
  .layout { padding-bottom: 24px; }

  /* Mobile: result pinned on top, controls below. Desktop: controls left, result pinned right. */
  .layout { display: flex; flex-direction: column; gap: 16px; }
  .result {
    order: -1; position: sticky; top: 0; z-index: 1;
    background: #fff; padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  @media (min-width: 760px) {
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; align-items: start; }
    .result { order: 0; top: 16px; padding: 0; border-bottom: none; }
  }

  .field { margin-bottom: 18px; }
  .field-label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #555; }
  textarea { width: 100%; font-size: 18px; padding: 8px; border: 1px solid #bbb; border-radius: 6px; resize: vertical; }
  .options { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .options label { white-space: nowrap; }
  .options + .options { margin-top: 4px; }

  .palette { display: flex; flex-direction: column; gap: 8px; }
  .palette-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { width: 28px; height: 28px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; padding: 0; }
  .swatch.selected, .custom.selected input { outline: 3px solid #333; outline-offset: 1px; }
  .custom { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer; margin-left: 8px; }
  .custom input { width: 28px; height: 28px; padding: 0; border: 1px solid #ccc; border-radius: 4px; background: none; cursor: pointer; }
  .custom input::-webkit-color-swatch-wrapper { padding: 0; }
  .custom input::-webkit-color-swatch { border: none; border-radius: 3px; }

  .images { display: flex; gap: 8px; align-items: flex-start; }
  .checker {
    flex: none; line-height: 0;
    background: repeating-conic-gradient(#e6e6e6 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
    border: 1px solid var(--border);
  }
  #output { width: 128px; height: 128px; }
  .previews { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* Sizes mimic Slack: 22px inline in a message, 16px in a reaction. */
  .preview { border: 1px solid var(--border); padding: 6px 10px; font-size: 14px; white-space: nowrap; }
  .preview p { margin: 0 0 4px; }
  .preview img { width: 16px; height: 16px; vertical-align: middle; }
  .preview img.inline { width: 22px; height: 22px; }
  .reaction { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 12px; font-size: 12px; }
  .preview.light { background: #fff; color: #1d1c1d; }
  .preview.light .reaction { background: #e8f5fa; border: 1px solid #1d9bd1; color: #1264a3; }
  .preview.dark { background: #1a1d21; color: #d1d2d3; }
  .preview.dark .reaction { background: #1b3a4b; border: 1px solid #1d9bd1; color: #e8e8e8; }

  .save { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .save label { font-size: 14px; white-space: nowrap; }
  .save input { flex: 1; min-width: 0; font-size: 14px; padding: 5px 8px; border: 1px solid #bbb; border-radius: 4px; }
  .save button { font-size: 14px; padding: 5px 16px; border: none; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  .save button:disabled { background: #ccc; cursor: default; }
</style>
</head>
<body>
<header class="header"><h1>絵文字ジェネレーター（ローカル生成）</h1></header>

<div class="layout">
  <div class="controls">
    <div class="field">
      <label class="field-label" for="text">テキスト</label>
      <textarea id="text" rows="3">絵文
字。</textarea>
    </div>

    <div class="field">
      <span class="field-label">文字揃え</span>
      <div class="options">
        <label><input type="radio" name="align" value="left"> 左揃え</label>
        <label><input type="radio" name="align" value="center" checked> 中央揃え</label>
        <label><input type="radio" name="align" value="right"> 右揃え</label>
      </div>
      <div class="options">
        <label><input type="checkbox" id="uniform-width" checked> 文字幅を最小の段に揃える</label>
      </div>
    </div>

    <div class="field">
      <span class="field-label">フォント</span>
      <div class="options" id="fonts"></div>
    </div>

    <div class="field">
      <span class="field-label">色</span>
      <div class="palette" id="palette"></div>
    </div>
  </div>

  <div class="result">
    <div class="images">
      <div class="checker"><img id="output" alt=""></div>
      <div class="previews">
        <div class="preview light">
          <p>メッセージ <img class="preview-img inline" alt=""> です</p>
          <span class="reaction"><img class="preview-img" alt=""> 1</span>
        </div>
        <div class="preview dark">
          <p>メッセージ <img class="preview-img inline" alt=""> です</p>
          <span class="reaction"><img class="preview-img" alt=""> 1</span>
        </div>
      </div>
    </div>
    <form class="save" id="save-form">
      <label for="name">ダウンロード:</label>
      <input id="name" type="text">
      <button id="save">保存</button>
    </form>
  </div>
</div>

<script>
const SIZE = 128;

// The original site's top three Japanese fonts, substituted with the closest Google Fonts.
const FONTS = [
  { key: 'notosans', name: 'Noto Sans JP Bold', css: '700 {px}px "Noto Sans JP"' },
  { key: 'mplus-1p', name: 'M+ 1p black', css: '900 {px}px "M PLUS 1p"' },
  { key: 'rounded-mplus', name: 'Rounded M+ black', css: '900 {px}px "M PLUS Rounded 1c"' },
];

// Row 1: mid-tones with >= 3:1 contrast against both the light (#fff) and dark (#1a1d21) previews.
// Row 2: the same hues tinted toward white (~2.3:1 on light, ~7.4:1 on dark); gray has no lighter variant.
const PALETTE = [
  ['#1E93AB', '#1F9C76', '#E0457F', '#D97706', '#4C6EF5', '#2E9E3A', '#F03E3E', '#9C5DE0', '#868E96'],
  ['#68B7C7', '#64BBA0', '#EC8FB2', '#E49D4C', '#94A8F9', '#6FBC77', '#F68F8F', '#C29BEC'],
];

let color = PALETTE[0][0];

const textEl = document.getElementById('text');
const nameEl = document.getElementById('name');
const outputEl = document.getElementById('output');
const saveEl = document.getElementById('save');

const fontsEl = document.getElementById('fonts');
FONTS.forEach((f, i) => {
  const label = document.createElement('label');
  label.innerHTML = `<input type="radio" name="font" value="${f.key}"${i === 0 ? ' checked' : ''}> ${f.name}`;
  fontsEl.appendChild(label);
});

const paletteEl = document.getElementById('palette');
const custom = document.createElement('label');
custom.className = 'custom';
custom.innerHTML = '<input type="color"> カスタム';
const picker = custom.querySelector('input');
picker.addEventListener('input', () => selectColor(picker.value));

function selectColor(c) {
  color = c.toUpperCase();
  picker.value = color.toLowerCase();
  let inPalette = false;
  paletteEl.querySelectorAll('.swatch').forEach(s => {
    const selected = s.dataset.color === color;
    s.classList.toggle('selected', selected);
    inPalette ||= selected;
  });
  custom.classList.toggle('selected', !inPalette);
  update();
}

PALETTE.forEach((colors, i) => {
  const row = document.createElement('div');
  row.className = 'palette-row';
  colors.forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.dataset.color = c;
    b.title = c;
    b.addEventListener('click', () => selectColor(c));
    row.appendChild(b);
  });
  if (i === 0) row.appendChild(custom);
  paletteEl.appendChild(row);
});

// Each line gets an equal share of the height and is scaled so its ink fills it vertically.
// Lines that would overflow the width are squeezed horizontally; narrower lines are aligned.
// With uniformWidth, every line uses the strongest squeeze (sx / sy) among all lines.
function render(text, font, align, fill, uniformWidth) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const lines = text.split('\n');
  const lineH = SIZE / lines.length;
  const base = 200;

  ctx.font = font.css.replace('{px}', base);
  ctx.fillStyle = fill;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  const metrics = lines.map(line => {
    if (!line.trim()) return null;
    const m = ctx.measureText(line);
    const left = m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight;
    const ascent = m.actualBoundingBoxAscent, descent = m.actualBoundingBoxDescent;
    const inkW = left + right, inkH = ascent + descent;
    if (inkW <= 0 || inkH <= 0) return null;
    const sy = lineH / inkH;
    return { left, ascent, inkW, sy, squeeze: Math.min(1, SIZE / (inkW * sy)) };
  });
  const minSqueeze = Math.min(1, ...metrics.filter(Boolean).map(m => m.squeeze));

  metrics.forEach((m, i) => {
    if (!m) return;
    const { left, ascent, inkW, sy } = m;
    const sx = sy * (uniformWidth ? minSqueeze : m.squeeze);
    const w = inkW * sx;
    const x0 = align === 'left' ? 0 : align === 'right' ? SIZE - w : (SIZE - w) / 2;
    const y0 = lineH * i;

    ctx.setTransform(sx, 0, 0, sy, x0 + left * sx, y0 + ascent * sy);
    ctx.fillText(lines[i], 0, 0);
  });
  return canvas.toDataURL('image/png');
}

// Lines joined with "-", e.g. "絵\n文字" -> "絵-文字". Characters invalid in file names are dropped.
function suggestName(text) {
  const name = text.split('\n')
    .map(line => line.trim().replace(/\s+/g, '-'))
    .filter(Boolean)
    .join('-')
    .replace(/[\\/:*?"<>|]/g, '');
  return name || 'emoji';
}

// Once the file name is edited by hand it is no longer overwritten,
// until either the name field or the text is cleared.
let nameEdited = false;
nameEl.addEventListener('input', () => { nameEdited = nameEl.value.trim() !== ''; });

// Redraw on every change. Font loading is async, so a stale result is discarded.
let renderId = 0;
async function update() {
  const id = ++renderId;
  const text = textEl.value.replace(/\r/g, '');
  const font = FONTS.find(f => f.key === document.querySelector('input[name=font]:checked').value);
  const align = document.querySelector('input[name=align]:checked').value;
  const uniformWidth = document.getElementById('uniform-width').checked;

  if (!text.trim()) nameEdited = false;
  if (!nameEdited) nameEl.value = text.trim() ? suggestName(text) : '';
  saveEl.disabled = !text.trim();

  // Google Fonts are split into unicode-range subsets, so load the ones this text needs.
  if (text.trim()) await document.fonts.load(font.css.replace('{px}', 200), text);
  if (id !== renderId) return;

  const src = render(text, font, align, color, uniformWidth);
  outputEl.src = src;
  document.querySelectorAll('.preview-img').forEach(img => img.src = src);
}

textEl.addEventListener('input', update);
document.querySelector('.controls').addEventListener('change', e => {
  if (e.target.type === 'radio' || e.target.type === 'checkbox') update();
});

document.getElementById('save-form').addEventListener('submit', e => {
  e.preventDefault();
  if (saveEl.disabled) return;
  const name = nameEl.value.trim().replace(/\.png$/i, '') || 'emoji';
  const a = document.createElement('a');
  a.href = outputEl.src;
  a.download = name + '.png';
  a.click();
});

selectColor(color);
</script>
</body>
</html>
