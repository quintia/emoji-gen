<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絵文字ジェネレーター (mini)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=M+PLUS+1p:wght@900&family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #333; }
  h1 { font-size: 20px; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 0 0 16px; padding: 8px 12px 12px; }
  legend { font-weight: bold; font-size: 14px; }
  textarea { width: 100%; box-sizing: border-box; font-size: 18px; padding: 8px; }
  label { margin-right: 16px; white-space: nowrap; }
  .palette { display: flex; flex-direction: column; gap: 8px; }
  .palette-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { width: 28px; height: 28px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; padding: 0; }
  .swatch.selected { outline: 3px solid #333; outline-offset: 1px; }
  input[type=color] { width: 36px; height: 30px; padding: 0; border: none; background: none; cursor: pointer; }
  button#generate { font-size: 18px; padding: 10px 32px; border: none; border-radius: 6px; background: #EC71A1; color: #fff; cursor: pointer; }
  #result { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
  #result[hidden] { display: none; }
  /* Sizes mimic Slack: 22px inline in a message, 16px in a reaction. */
  .preview { border: 1px solid #ddd; padding: 12px 16px; font-size: 15px; }
  .preview p { margin: 0 0 8px; }
  .preview img { width: 16px; height: 16px; vertical-align: middle; }
  .preview img.inline { width: 22px; height: 22px; }
  .reaction { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  .preview.light { background: #fff; color: #1d1c1d; }
  .preview.light .reaction { background: #e8f5fa; border: 1px solid #1d9bd1; color: #1264a3; }
  .preview.dark { background: #1a1d21; color: #d1d2d3; }
  .preview.dark .reaction { background: #1b3a4b; border: 1px solid #1d9bd1; color: #e8e8e8; }
  .main { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .save { display: flex; gap: 6px; }
  .save input { width: 160px; font-size: 14px; padding: 4px 6px; }
  .save button { font-size: 14px; padding: 4px 12px; cursor: pointer; }
  .checker {
    line-height: 0;
    background: repeating-conic-gradient(#e6e6e6 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;
    border: 1px solid #ddd;
  }
</style>
</head>
<body>
<h1>絵文字にしたい文字を入力してください！</h1>

<fieldset>
  <legend>テキスト</legend>
  <textarea id="text" rows="3">絵文
字。</textarea>
</fieldset>

<fieldset>
  <legend>文字揃え</legend>
  <label><input type="radio" name="align" value="left"> 左揃え</label>
  <label><input type="radio" name="align" value="center" checked> 中央揃え</label>
  <label><input type="radio" name="align" value="right"> 右揃え</label>
  <div><label><input type="checkbox" id="uniform-width"> 文字幅を最小の段に揃える</label></div>
</fieldset>

<fieldset>
  <legend>フォント</legend>
  <div id="fonts"></div>
</fieldset>

<fieldset>
  <legend>色</legend>
  <div class="palette" id="palette"></div>
</fieldset>

<button id="generate">生成する♪</button>

<div id="result" hidden>
  <div class="main">
    <div class="checker"><img id="output" width="128" height="128" alt=""></div>
    <div class="save">
      <input id="name" type="text" aria-label="ファイル名">
      <button id="save">保存</button>
    </div>
  </div>
  <div class="preview light">
    <p>メッセージ <img class="preview-img inline" alt=""> です</p>
    <span class="reaction"><img class="preview-img" alt=""> 1</span>
  </div>
  <div class="preview dark">
    <p>メッセージ <img class="preview-img inline" alt=""> です</p>
    <span class="reaction"><img class="preview-img" alt=""> 1</span>
  </div>
</div>

<script>
const SIZE = 128;

// The original site's top three Japanese fonts, substituted with the closest Google Fonts.
const FONTS = [
  { key: 'notosans', name: 'Noto Sans JP Bold', css: '700 {px}px "Noto Sans JP"' },
  { key: 'mplus-1p', name: 'M+ 1p black', css: '900 {px}px "M PLUS 1p"' },
  { key: 'rounded-mplus', name: 'Rounded M+ black', css: '900 {px}px "M PLUS Rounded 1c"' },
];

// Row 1: mid-tones with >= 3:1 contrast against both the light (#fff) and dark (#1a1d21) previews.
// Row 2: the same hues tinted toward white (~2.3:1 on light, ~7.4:1 on dark); gray has no lighter variant.
const PALETTE = [
  ['#1E93AB', '#1F9C76', '#E0457F', '#D97706', '#4C6EF5', '#2E9E3A', '#F03E3E', '#9C5DE0', '#868E96'],
  ['#68B7C7', '#64BBA0', '#EC8FB2', '#E49D4C', '#94A8F9', '#6FBC77', '#F68F8F', '#C29BEC'],
];

let color = '#E0457F';

const fontsEl = document.getElementById('fonts');
FONTS.forEach((f, i) => {
  const label = document.createElement('label');
  label.innerHTML = `<input type="radio" name="font" value="${f.key}"${i === 0 ? ' checked' : ''}> ${f.name}`;
  fontsEl.appendChild(label);
});

const paletteEl = document.getElementById('palette');
const picker = document.createElement('input');
picker.type = 'color';
picker.value = color;
picker.title = 'カスタム';
picker.addEventListener('input', () => selectColor(picker.value));

function selectColor(c) {
  color = c.toUpperCase();
  picker.value = color.toLowerCase();
  paletteEl.querySelectorAll('.swatch').forEach(s => s.classList.toggle('selected', s.dataset.color === color));
}

PALETTE.forEach((colors, i) => {
  const row = document.createElement('div');
  row.className = 'palette-row';
  colors.forEach(c => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    b.dataset.color = c;
    b.title = c;
    b.addEventListener('click', () => selectColor(c));
    row.appendChild(b);
  });
  if (i === 0) row.appendChild(picker);
  paletteEl.appendChild(row);
});
selectColor(color);

// Each line gets an equal share of the height and is scaled so its ink fills it vertically.
// Lines that would overflow the width are squeezed horizontally; narrower lines are aligned.
// With uniformWidth, every line uses the strongest squeeze (sx / sy) among all lines.
function render(text, font, align, fill, uniformWidth) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const lines = text.split('\n');
  const lineH = SIZE / lines.length;
  const base = 200;

  ctx.font = font.css.replace('{px}', base);
  ctx.fillStyle = fill;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  const metrics = lines.map(line => {
    if (!line.trim()) return null;
    const m = ctx.measureText(line);
    const left = m.actualBoundingBoxLeft, right = m.actualBoundingBoxRight;
    const ascent = m.actualBoundingBoxAscent, descent = m.actualBoundingBoxDescent;
    const inkW = left + right, inkH = ascent + descent;
    if (inkW <= 0 || inkH <= 0) return null;
    const sy = lineH / inkH;
    return { left, ascent, inkW, sy, squeeze: Math.min(1, SIZE / (inkW * sy)) };
  });
  const minSqueeze = Math.min(1, ...metrics.filter(Boolean).map(m => m.squeeze));

  metrics.forEach((m, i) => {
    if (!m) return;
    const { left, ascent, inkW, sy } = m;
    const sx = sy * (uniformWidth ? minSqueeze : m.squeeze);
    const w = inkW * sx;
    const x0 = align === 'left' ? 0 : align === 'right' ? SIZE - w : (SIZE - w) / 2;
    const y0 = lineH * i;

    ctx.setTransform(sx, 0, 0, sy, x0 + left * sx, y0 + ascent * sy);
    ctx.fillText(lines[i], 0, 0);
  });
  return canvas.toDataURL('image/png');
}

// Lines joined with "-", e.g. "絵\n文字" -> "絵-文字". Characters invalid in file names are dropped.
function suggestName(text) {
  const name = text.split('\n')
    .map(line => line.trim().replace(/\s+/g, '-'))
    .filter(Boolean)
    .join('-')
    .replace(/[\\/:*?"<>|]/g, '');
  return name || 'emoji';
}

document.getElementById('generate').addEventListener('click', async () => {
  const text = document.getElementById('text').value.replace(/\r/g, '');
  if (!text.trim()) return;
  const font = FONTS.find(f => f.key === document.querySelector('input[name=font]:checked').value);
  const align = document.querySelector('input[name=align]:checked').value;

  // Google Fonts are split into unicode-range subsets, so load the ones this text needs.
  await document.fonts.load(font.css.replace('{px}', 200), text);

  const uniformWidth = document.getElementById('uniform-width').checked;
  const src = render(text, font, align, color, uniformWidth);
  document.getElementById('output').src = src;
  document.querySelectorAll('.preview-img').forEach(img => img.src = src);
  document.getElementById('name').value = suggestName(text);
  document.getElementById('result').hidden = false;
});

document.getElementById('save').addEventListener('click', () => {
  const name = document.getElementById('name').value.trim().replace(/\.png$/i, '') || 'emoji';
  const a = document.createElement('a');
  a.href = document.getElementById('output').src;
  a.download = name + '.png';
  a.click();
});
</script>
</body>
</html>
